<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Log In')}">
  <meta charset="UTF-8" />
  <title>EduShop · Log In</title>
  <link rel="stylesheet" href="../../static/css/style.css" />
</head>
<body>

  <div class="auth-wrap">

    <div class="auth-panel">
      <div class="panel-content">
        <div class="brand"><span class="brand-mark">E</span><span>EduShop</span></div>
        <h2>Welcome back to your learning marketplace.</h2>
        <p>Pick up where you left off &mdash; track orders, manage your wishlist and keep shopping for everything school.</p>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-box">
        <div class="brand"><span class="brand-mark">E</span><span>EduShop</span></div>
        <h1>Log in to your account</h1>
        <p class="sub text-center">Enter your details to continue.</p>

        <div th:replace="~{fragments/alerts :: alert(type='error', title='Login failed', message='Incorrect email or password. Please try again.')}"
             th:if="${loginError}"></div>

        <form th:action="@{/login}" action="#" method="post">
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <div class="input-icon-wrap">
              <span class="field-icon">&#9993;</span>
              <input class="form-control" type="email" id="email" name="email" placeholder="you@school.edu" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-icon-wrap">
              <span class="field-icon">&#128274;</span>
              <input class="form-control" type="password" id="password" name="password" placeholder="••••••••" required />
            </div>
          </div>

          <div class="form-row" style="margin-bottom: var(--space-5);">
            <label class="checkbox-line"><input type="checkbox" name="remember" /> Remember me</label>
            <a href="#" class="form-link">Forgot password?</a>
          </div>

          <button class="btn btn-primary btn-block" type="submit">Log In</button>
        </form>

        <div class="form-divider">or</div>
        <button class="btn btn-ghost btn-block" type="button">Continue with Google</button>

        <p class="auth-footer-link">
          Don&rsquo;t have an account?
          <a th:href="@{/register}" class="form-link">Create one</a>
        </p>
      </div>
    </div>
  </div>

</body>
</html>
