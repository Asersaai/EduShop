<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Create Account')}">
  <meta charset="UTF-8" />
  <title>EduShop · Create Account</title>
  <link rel="stylesheet" href="../../static/css/style.css" />
</head>
<body>

  <div class="auth-wrap">

    <div class="auth-panel">
      <div class="panel-content">
        <div class="brand"><span class="brand-mark">E</span><span>EduShop</span></div>
        <h2>Join thousands of students shopping smarter.</h2>
        <p>Create an account to track orders, save favorites and get early access to student-only deals.</p>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-box">
        <div class="brand"><span class="brand-mark">E</span><span>EduShop</span></div>
        <h1>Create your account</h1>
        <p class="sub text-center">It only takes a minute.</p>

        <div th:replace="~{fragments/alerts :: alert(type='error', title='Could not register', message='Please check the fields below and try again.')}"
             th:if="${registerError}"></div>

        <form th:action="@{/register}" action="#" method="post">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <div class="input-icon-wrap">
              <span class="field-icon">&#128100;</span>
              <input class="form-control" type="text" id="username" name="username" placeholder="janedoe" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <div class="input-icon-wrap">
              <span class="field-icon">&#9993;</span>
              <input class="form-control" type="email" id="email" name="email" placeholder="you@school.edu" required />
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" type="password" id="password" name="password" placeholder="••••••••" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="confirmPassword">Confirm password</label>
              <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required />
            </div>
          </div>

          <div class="form-group">
            <label class="checkbox-line">
              <input type="checkbox" name="agree" required />
              I agree to the Terms of Service and Privacy Policy
            </label>
          </div>

          <button class="btn btn-primary btn-block" type="submit">Create Account</button>
        </form>

        <p class="auth-footer-link">
          Already have an account?
          <a th:href="@{/login}" href="login.html" class="form-link">Log in</a>
        </p>
      </div>
    </div>
  </div>

</body>
</html>
