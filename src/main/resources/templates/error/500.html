<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Server Error')}">
  <meta charset="UTF-8" />
  <title>EduShop · 500</title>
  <link rel="stylesheet" href="../../static/css/style.css" />
</head>
<body>

  <div class="error-page">
    <div class="error-content">
      <div class="error-code">500</div>
      <h2>Something broke on our end.</h2>
      <p>Our servers hit a snag while handling your request. It&rsquo;s not you &mdash; our team has been notified and is on it.</p>
      <div class="error-actions">
        <a href="#" class="btn btn-primary">Retry</a>
        <a th:href="@{/}" href="../public/home.html" class="btn btn-outline">Back to Home</a>
      </div>
    </div>
  </div>

</body>
</html>
