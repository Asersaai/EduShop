<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Page Not Found')}">
  <meta charset="UTF-8" />
  <title>EduShop · 404</title>
  <link rel="stylesheet" href="../../static/css/style.css" />
</head>
<body>

  <div class="error-page">
    <div class="error-content">
      <div class="error-code">404</div>
      <h2>This page wandered off campus.</h2>
      <p>The page you&rsquo;re looking for doesn&rsquo;t exist, moved, or the link is outdated. Let&rsquo;s get you back on track.</p>
      <div class="error-actions">
        <a th:href="@{/}" href="../public/home.html" class="btn btn-primary">Back to Home</a>
        <a act="/home" href="../public/shop.html" class="btn btn-outline">Browse Shop</a>
      </div>
    </div>
  </div>

</body>
</html>
